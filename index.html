<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f8">
  <title>Control de Perecederos · Escáner BLE</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f8;color:#1f2937}
    body{padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
    .card{max-width:560px;margin:0 auto;background:#fff;border:1px solid #dce2e8;border-radius:18px;padding:22px;box-shadow:0 8px 24px #0000000d}
    h1{font-size:28px;margin:0 0 10px}.status{font-size:18px;line-height:1.4;min-height:54px;margin:8px 0 14px}
    button,input{width:100%;min-height:58px;border-radius:14px;font-size:20px;padding:14px 16px}
    button{border:0;background:#2458d6;color:#fff;font-weight:750;margin:8px 0}button.secondary{background:#5b6575}.send{display:none}
    input{border:2px solid #bcc5d0;margin:8px 0;background:#fff;color:#111827}
    .small{font-size:14px;color:#667085;line-height:1.45;margin-top:14px}.ok{color:#167a3f}.err{color:#b42318}.hidden{display:none}
  </style>
</head>
<body>
<main class="card">
  <h1>📱 Control de Perecederos</h1>
  <div id="status" class="status">Preparado para conectar con el PC.</div>
  <button id="connect">Conectar al PC</button>
  <section id="sendBox" class="send">
    <input id="code" inputmode="text" autocomplete="off" enterkeyhint="send" placeholder="Código">
    <button id="send">Enviar código</button>
    <button id="paste" class="secondary">Pegar y enviar</button>
  </section>
  <div id="compat" class="small"></div>
  <div class="small">La primera vez el navegador debe pedir permiso para elegir el PC. Después intentará reutilizar el dispositivo ya autorizado. No se usa Wi‑Fi ni se abre ningún puerto TCP en Windows.</div>
</main>
<script>
(() => {
  'use strict';
  const SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
  const WRITE = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
  const token = (() => {
    const h = location.hash.replace(/^#/, '');
    if (h.startsWith('token=')) return decodeURIComponent(h.slice(6));
    return h;
  })();
  const status = document.getElementById('status');
  const connect = document.getElementById('connect');
  const sendBox = document.getElementById('sendBox');
  const code = document.getElementById('code');
  const send = document.getElementById('send');
  const paste = document.getElementById('paste');
  const compat = document.getElementById('compat');
  let characteristic = null;
  let device = null;

  function setStatus(text, kind='') {
    status.textContent = text;
    status.className = 'status ' + kind;
  }

  function browserHint() {
    const secure = window.isSecureContext;
    const hasBt = !!navigator.bluetooth;
    if (!secure) return 'Esta página no está en un contexto HTTPS seguro.';
    if (!hasBt) return 'Este navegador no expone Web Bluetooth. Ábrela en Chrome o Samsung Internet actualizado.';
    return '';
  }

  async function characteristicFor(d) {
    const server = d.gatt.connected ? d.gatt : await d.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
    return await service.getCharacteristic(WRITE);
  }

  async function tryKnownDevice() {
    if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return false;
    const known = await navigator.bluetooth.getDevices();
    for (const d of known) {
      try {
        const c = await characteristicFor(d);
        device = d;
        characteristic = c;
        return true;
      } catch (_) {}
    }
    return false;
  }

  async function connectNow() {
    const hint = browserHint();
    if (hint) {
      setStatus(hint, 'err');
      compat.textContent = 'Diagnóstico: secure=' + window.isSecureContext + ', navigator.bluetooth=' + !!navigator.bluetooth;
      return;
    }
    if (!token) {
      setStatus('El QR no contiene un token de sesión válido. Vuelve a escanearlo desde el PC.', 'err');
      return;
    }
    setStatus('Buscando un PC ya autorizado…');
    connect.disabled = true;
    try {
      let ok = await tryKnownDevice();
      if (!ok) {
        setStatus('Selecciona el PC en la ventana Bluetooth.');
        device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE]
        });
        characteristic = await characteristicFor(device);
      }
      device.addEventListener('gattserverdisconnected', () => {
        characteristic = null;
        sendBox.style.display = 'none';
        connect.style.display = 'block';
        connect.disabled = false;
        setStatus('Conexión perdida. Pulsa Conectar al PC para reconectar.', 'err');
      }, { once: true });
      setStatus('✓ PC conectado', 'ok');
      connect.style.display = 'none';
      sendBox.style.display = 'block';
      code.focus();
    } catch (e) {
      setStatus('No conecta: ' + (e.name || 'Error') + ' · ' + (e.message || String(e)), 'err');
      compat.textContent = 'Diagnóstico: secure=' + window.isSecureContext + ', navigator.bluetooth=' + !!navigator.bluetooth;
      connect.disabled = false;
    }
  }

  async function sendCode(value) {
    const v = String(value || '').trim();
    if (!v) { setStatus('Introduce o pega un código.'); return; }
    if (!characteristic) { setStatus('Primero conecta con el PC.', 'err'); return; }
    try {
      const data = new TextEncoder().encode(token + '|' + v);
      if (characteristic.writeValueWithResponse) await characteristic.writeValueWithResponse(data);
      else await characteristic.writeValue(data);
      setStatus('✓ Enviado: ' + v, 'ok');
      code.value = '';
      code.focus();
    } catch (e) {
      setStatus('No se pudo enviar: ' + (e.name || 'Error') + ' · ' + (e.message || String(e)), 'err');
    }
  }

  connect.addEventListener('click', connectNow);
  send.addEventListener('click', () => sendCode(code.value));
  code.addEventListener('keydown', e => { if (e.key === 'Enter') sendCode(code.value); });
  paste.addEventListener('click', async () => {
    try {
      const v = await navigator.clipboard.readText();
      code.value = v.trim();
      if (code.value) await sendCode(code.value);
    } catch (_) {
      setStatus('No puedo leer el portapapeles automáticamente. Mantén pulsado en Código y pulsa Pegar.', 'err');
    }
  });

  const hint = browserHint();
  if (hint) {
    setStatus(hint, 'err');
    compat.textContent = 'Diagnóstico: secure=' + window.isSecureContext + ', navigator.bluetooth=' + !!navigator.bluetooth;
  }
})();
</script>
</body>
</html>
