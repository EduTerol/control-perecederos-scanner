<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202225">
<title>Control de Perecederos · Escáner móvil</title>
<meta name="application-version" content="3.2.24">
<style>
:root{--bg:#202225;--panel:#292c31;--field:#34383e;--fg:#f2f3f5;--muted:#c3c7ce;--border:#4a4f57;--accent:#3976c6;--accent2:#315f91;--danger:#542c31;--dangerfg:#ffd9dc;--ok:#86d6a3;--warn:#f4c86b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
body{padding:max(10px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom))}.card{max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 10px 30px #00000042}
h1{font-size:25px;margin:0 0 6px}.status{font-size:16px;line-height:1.35;min-height:43px;margin:6px 0 8px;color:var(--fg)}.ok{color:var(--ok)}.err{color:#ffb4b4}.warn{color:var(--warn)}.muted{font-size:13px;color:var(--muted);line-height:1.4}
#timer{text-align:center;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0 8px;color:var(--fg)}
.camera{position:relative;width:100%;aspect-ratio:4/3;background:#15171a;border-radius:16px;overflow:hidden;border:1px solid var(--border)}video{width:100%;height:100%;object-fit:cover;display:block}.camera.paused video{filter:brightness(.48)}
.guide{position:absolute;left:8%;right:8%;top:28%;height:44%;border:3px solid rgba(242,243,245,.95);border-radius:15px;box-shadow:0 0 0 999px rgba(0,0,0,.16);pointer-events:none}.guide:after{content:'Apunta al código';position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);white-space:nowrap;color:var(--fg);font-weight:700;text-shadow:0 1px 3px #000;font-size:15px}
#cameraMsg{position:absolute;left:10px;right:10px;top:10px;background:rgba(32,34,37,.88);color:var(--fg);border:1px solid var(--border);padding:8px 10px;border-radius:10px;font-size:13px;text-align:center}.hidden{display:none!important}
input,button{width:100%;min-height:52px;border-radius:13px;font-size:18px;padding:12px 14px}input{border:2px solid var(--border);margin:9px 0 5px;background:var(--field);color:var(--fg);font-weight:650;outline:none}input:focus{border-color:var(--accent)}input::placeholder{color:#9da3ad}button{border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:750;margin:5px 0}button:active{background:var(--accent2)}button.secondary{background:var(--field);border-color:var(--border);color:var(--fg)}button.danger{background:var(--danger);border-color:#744047;color:var(--dangerfg)}button.ghost{background:var(--field);border-color:var(--border);color:var(--fg)}button:disabled,input:disabled{opacity:.5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.last{font-weight:700;min-height:22px;margin-top:4px;color:var(--muted)}.detected{border-color:var(--accent)!important;background:#2f3f55!important;color:var(--fg)!important}
</style>
<script src="https://unpkg.com/@zxing/browser@0.2.1" defer></script>
</head>
<body>
<main class="card">
<h1>📱 Control de Perecederos</h1>
<div id="status" class="status">Conectando con la sesión del PC…</div>
<div id="timer">05:00</div>
<button id="switchCamera" class="ghost">↻ Cambiar a cámara delantera</button>
<div id="camera" class="camera">
  <video id="video" playsinline muted></video>
  <div class="guide"></div>
  <div id="cameraMsg">Iniciando cámara…</div>
</div>
<button id="retryCamera" class="ghost hidden">Reintentar cámara</button>
<input id="code" autocomplete="off" autocapitalize="off" inputmode="text" enterkeyhint="send" placeholder="Código detectado o manual">
<div class="actions">
  <button id="send">Enviar</button>
  <button id="cancel" class="secondary">Cancelar</button>
</div>
<div id="last" class="last"></div>
<button id="end" class="danger">Terminar sesión</button>
<p class="muted">La cámara intenta abrirse automáticamente. Si el navegador pide permiso, concédelo una vez. Solo se envía el texto del código; el vídeo no sale del móvil. <span style="opacity:.65">Web v3.2.24</span></p>
</main>
<script>
(() => {
'use strict';
const p=new URLSearchParams(location.hash.replace(/^#/,''));
const token=p.get('token')||'', topic=p.get('topic')||'', exp=Number(p.get('exp')||0);
const relay='https://ntfy.sh/';
const status=document.getElementById('status'), timer=document.getElementById('timer'), code=document.getElementById('code'), send=document.getElementById('send'), cancel=document.getElementById('cancel'), end=document.getElementById('end'), last=document.getElementById('last');
const camera=document.getElementById('camera'), video=document.getElementById('video'), cameraMsg=document.getElementById('cameraMsg'), retryCamera=document.getElementById('retryCamera'), switchCamera=document.getElementById('switchCamera');
let ended=false, helloTimer=null, stream=null, detector=null, scanTimer=null, zxingControls=null, pendingCode=false, scanning=false, lastDetected='', lastDetectedAt=0, facing='environment';
function setStatus(t,k=''){status.textContent=t;status.className='status '+k}
function valid(){return token.length>=20 && /^cp-[a-f0-9]{20,}$/i.test(topic) && exp>0}
function setCameraMsg(t,hide=false){cameraMsg.textContent=t;cameraMsg.classList.toggle('hidden',!!hide)}
function stopCamera(){scanning=false;if(scanTimer){clearTimeout(scanTimer);scanTimer=null}if(zxingControls){try{zxingControls.stop()}catch(_){ }zxingControls=null}if(stream){for(const tr of stream.getTracks())try{tr.stop()}catch(_){ }stream=null}try{video.srcObject=null}catch(_){}}
function disableAll(){ended=true;stopCamera();[code,send,cancel,end,retryCamera,switchCamera].forEach(x=>x.disabled=true);if(helloTimer)clearInterval(helloTimer)}
async function publish(obj){
  const r=await fetch(relay+encodeURIComponent(topic),{method:'POST',headers:{'Firebase':'no','Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({...obj,token})});
  if(!r.ok)throw new Error('HTTP '+r.status);return r;
}
async function hello(silent=false){if(ended||!valid())return;try{await publish({type:'hello',time:Date.now()});if(!silent)setStatus('✓ Sesión enlazada. Apunta la cámara al código.','ok')}catch(e){if(!silent)setStatus('No se pudo enlazar por Internet: '+(e.message||e),'err')}}
function pauseForCode(v){
  if(ended||pendingCode)return;v=String(v||'').trim();if(!v)return;
  const now=Date.now();if(v===lastDetected && now-lastDetectedAt<1500)return;lastDetected=v;lastDetectedAt=now;
  pendingCode=true;code.value=v;code.classList.add('detected');camera.classList.add('paused');setCameraMsg('Código leído. Confirma Enviar o Cancelar.');setStatus('Código detectado. Confirma antes de continuar.','ok');
  if(navigator.vibrate)try{navigator.vibrate(60)}catch(_){ }
}
function resumeScanning(){pendingCode=false;code.value='';code.classList.remove('detected');camera.classList.remove('paused');setCameraMsg('Apunta al siguiente código.',false);setStatus('✓ Lector activo. Apunta al siguiente código.','ok')}
async function nativeLoop(){
  if(!scanning||ended)return;
  if(!pendingCode && detector && video.readyState>=2){
    try{const found=await detector.detect(video);if(found&&found.length)pauseForCode(found[0].rawValue)}catch(_){ }
  }
  scanTimer=setTimeout(nativeLoop,120);
}
function cameraConstraint(exact=true){
  return {video:{facingMode:exact?{exact:facing}:{ideal:facing},width:{ideal:1280},height:{ideal:720}},audio:false};
}
async function getCameraStream(){
  try{return await navigator.mediaDevices.getUserMedia(cameraConstraint(true))}
  catch(_){return await navigator.mediaDevices.getUserMedia(cameraConstraint(false))}
}
function updateCameraButton(){
  switchCamera.textContent=facing==='environment'?'↻ Cambiar a cámara delantera':'↻ Cambiar a cámara trasera';
}
async function startNative(){
  if(!('BarcodeDetector' in window))return false;
  let formats=[];try{formats=await BarcodeDetector.getSupportedFormats()}catch(_){ }
  const wanted=['ean_13','ean_8','code_128','code_39','codabar','itf','upc_a','upc_e','qr_code','data_matrix'];
  const use=wanted.filter(x=>formats.includes(x));
  try{detector=new BarcodeDetector(use.length?{formats:use}:undefined)}catch(_){detector=new BarcodeDetector()}
  stream=await getCameraStream();
  video.srcObject=stream;await video.play();scanning=true;updateCameraButton();setCameraMsg('Apunta al código.',false);nativeLoop();return true;
}
async function startZXing(){
  if(!window.ZXingBrowser||!ZXingBrowser.BrowserMultiFormatReader)return false;
  const reader=new ZXingBrowser.BrowserMultiFormatReader();
  const cb=(result,error,controls)=>{if(controls)zxingControls=controls;if(result&&!pendingCode&&!ended)pauseForCode(result.getText())};
  try{zxingControls=await reader.decodeFromConstraints(cameraConstraint(true),video,cb)}
  catch(_){zxingControls=await reader.decodeFromConstraints(cameraConstraint(false),video,cb)}
  scanning=true;updateCameraButton();setCameraMsg('Apunta al código.',false);return true;
}
async function startCamera(){
  if(ended)return;stopCamera();retryCamera.classList.add('hidden');setCameraMsg('Iniciando cámara…',false);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setCameraMsg('Este navegador no permite cámara web. Puedes escribir el código manualmente.');retryCamera.classList.remove('hidden');return}
  try{if(await startNative())return}catch(e){stopCamera()}
  try{if(await startZXing())return}catch(e){stopCamera();setCameraMsg('No se pudo abrir el lector: '+(e.message||e));retryCamera.classList.remove('hidden');setStatus('Puedes introducir el código manualmente o reintentar la cámara.','warn');return}
  setCameraMsg('Este navegador no dispone de detector de códigos. Puedes introducir el código manualmente.');retryCamera.classList.remove('hidden');setStatus('Lector automático no disponible en este navegador.','warn');
}
async function sendCode(v){
  v=String(v||'').trim();if(!v){setStatus('Lee o introduce un código.');return}if(ended)return;
  if(Date.now()/1000>=exp){setStatus('La sesión ha caducado. Genera un nuevo QR en el PC.','err');disableAll();return}
  send.disabled=true;cancel.disabled=true;
  try{await publish({type:'scan',code:v,time:Date.now()});last.textContent='✓ Enviado: '+v;resumeScanning()}
  catch(e){setStatus('No se pudo enviar: '+(e.message||e),'err')}
  finally{if(!ended){send.disabled=false;cancel.disabled=false}}
}
send.onclick=()=>sendCode(code.value);
cancel.onclick=()=>{resumeScanning();last.textContent='Código cancelado.'};
code.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendCode(code.value)}});
retryCamera.onclick=startCamera;
switchCamera.onclick=async()=>{
  if(ended)return;
  switchCamera.disabled=true;
  facing=facing==='environment'?'user':'environment';
  updateCameraButton();
  setStatus(facing==='environment'?'Cambiando a cámara trasera…':'Cambiando a cámara delantera…');
  try{await startCamera()}finally{if(!ended)switchCamera.disabled=false}
};
end.onclick=async()=>{if(ended)return;if(!confirm('¿Terminar la sesión móvil?'))return;try{await publish({type:'end',time:Date.now()})}catch(_){ }setStatus('Sesión terminada.','ok');timer.textContent='00:00';disableAll()};
function tick(){if(ended)return;const s=Math.max(0,Math.ceil(exp-Date.now()/1000));timer.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s<=0){setStatus('Sesión caducada. Genera un nuevo QR en el PC.','err');disableAll()}}
window.addEventListener('pagehide',stopCamera);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!ended&&!stream&&!zxingControls)startCamera()});
updateCameraButton();
if(!valid()){setStatus('QR de sesión no válido. Vuelve a abrir Escáner móvil en el PC.','err');disableAll()}else{
  hello(false);helloTimer=setInterval(()=>hello(true),2500);setTimeout(()=>{if(helloTimer){clearInterval(helloTimer);helloTimer=null}},15000);setInterval(tick,500);tick();
  // Se solicita la cámara automáticamente. El navegador puede mostrar su diálogo de permiso la primera vez.
  setTimeout(startCamera,120);
}
})();
</script>
</body>
</html>
