<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<title>Control de Perecederos · Escáner móvil</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f8;color:#1f2937}
body{padding:max(14px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom))}.card{max-width:560px;margin:0 auto;background:#fff;border:1px solid #dce2e8;border-radius:18px;padding:22px;box-shadow:0 8px 24px #0000000d}
h1{font-size:28px;margin:0 0 10px}.status{font-size:18px;line-height:1.4;min-height:52px;margin:8px 0 12px}.ok{color:#167a3f}.err{color:#b42318}.muted{font-size:14px;color:#667085;line-height:1.45}
input,button{width:100%;min-height:58px;border-radius:14px;font-size:20px;padding:14px 16px}input{border:2px solid #bcc5d0;margin:8px 0;background:#fff;color:#111827}button{border:0;background:#2458d6;color:#fff;font-weight:750;margin:8px 0}button.secondary{background:#5b6575}button.danger{background:#a53030}button:disabled,input:disabled{opacity:.5}.last{font-weight:700;min-height:26px;margin-top:6px}#timer{text-align:center;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0 10px}
</style>
</head>
<body>
<main class="card">
<h1>📱 Control de Perecederos</h1>
<div id="status" class="status">Conectando con la sesión del PC…</div>
<div id="timer">05:00</div>
<input id="code" autocomplete="off" autocapitalize="off" inputmode="text" enterkeyhint="send" placeholder="Código">
<button id="send">Enviar</button>
<button id="paste" class="secondary">Pegar y enviar</button>
<div id="last" class="last"></div>
<button id="end" class="danger">Terminar sesión</button>
<p class="muted">No usa Bluetooth ni la red local del PC. La página está alojada en GitHub Pages y los códigos se retransmiten por HTTPS mediante un canal temporal y aleatorio. Los mensajes se publican sin caché.</p>
</main>
<script>
(() => {
'use strict';
const p=new URLSearchParams(location.hash.replace(/^#/,''));
const token=p.get('token')||'', topic=p.get('topic')||'', exp=Number(p.get('exp')||0);
const relay='https://ntfy.sh/';
const status=document.getElementById('status'), timer=document.getElementById('timer'), code=document.getElementById('code'), send=document.getElementById('send'), paste=document.getElementById('paste'), end=document.getElementById('end'), last=document.getElementById('last');
let ended=false, helloTimer=null;
function setStatus(t,k=''){status.textContent=t;status.className='status '+k}
function disableAll(){ended=true;[code,send,paste,end].forEach(x=>x.disabled=true);if(helloTimer)clearInterval(helloTimer)}
function valid(){return token.length>=20 && /^cp-[a-f0-9]{20,}$/i.test(topic) && exp>0}
async function publish(obj){
  const r=await fetch(relay+encodeURIComponent(topic)+'?cache=no&firebase=no',{method:'POST',body:JSON.stringify({...obj,token})});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r;
}
async function hello(silent=false){
  if(ended||!valid())return;
  try{await publish({type:'hello',time:Date.now()});if(!silent)setStatus('✓ Sesión enlazada. Ya puedes enviar códigos.','ok')}
  catch(e){if(!silent)setStatus('No se pudo enlazar por Internet: '+(e.message||e),'err')}
}
async function sendCode(v){
  v=String(v||'').trim();if(!v){setStatus('Introduce o pega un código.');return}
  if(ended)return;
  if(Date.now()/1000>=exp){setStatus('La sesión ha caducado. Genera un nuevo QR en el PC.','err');disableAll();return}
  send.disabled=true;paste.disabled=true;
  try{await publish({type:'scan',code:v,time:Date.now()});last.textContent='✓ Enviado: '+v;setStatus('✓ Código enviado al PC.','ok');code.value='';code.focus()}
  catch(e){setStatus('No se pudo enviar: '+(e.message||e),'err')}
  finally{if(!ended){send.disabled=false;paste.disabled=false}}
}
send.onclick=()=>sendCode(code.value);
code.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendCode(code.value)}});
paste.onclick=async()=>{try{const v=(await navigator.clipboard.readText()).trim();if(v){code.value=v;await sendCode(v)}else setStatus('El portapapeles está vacío.')}catch(e){setStatus('Mantén pulsado en el campo Código y usa Pegar.','err')}};
end.onclick=async()=>{if(ended)return;if(!confirm('¿Terminar la sesión móvil?'))return;try{await publish({type:'end',time:Date.now()})}catch(e){}setStatus('Sesión terminada.','ok');timer.textContent='00:00';disableAll()};
function tick(){if(ended)return;const s=Math.max(0,Math.ceil(exp-Date.now()/1000));timer.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s<=0){setStatus('Sesión caducada. Genera un nuevo QR en el PC.','err');disableAll()}}
if(!valid()){setStatus('QR de sesión no válido. Vuelve a abrir Escáner móvil en el PC.','err');disableAll()}else{hello(false);helloTimer=setInterval(()=>hello(true),2500);setTimeout(()=>{if(helloTimer){clearInterval(helloTimer);helloTimer=null}},15000);setInterval(tick,500);tick();code.focus()}
})();
</script>
</body>
</html>
